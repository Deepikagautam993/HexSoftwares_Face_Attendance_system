<!DOCTYPE html>
<html>
<head>
    <title>Face Attendance Dashboard</title>

    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: Arial;
            margin: 0;
            text-align: center;
        }

        /* ===== HEADER ===== */
        .header {
            background: #111827;
            padding: 20px;
            border-bottom: 3px solid cyan;
        }

        .header h1 {
            color: cyan;
            margin: 0;
        }

        /* ===== MAIN CONTAINER ===== */
        .container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        /* ===== CARD ===== */
        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            width: 350px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* ===== BUTTON ===== */
        button {
            padding: 10px 15px;
            background: cyan;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #00bcd4;
        }

        /* ===== TABLE ===== */
        table {
            width: 100%;
            margin-top: 10px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid white;
            padding: 8px;
        }

        th {
            background: #0f172a;
        }

        /* ===== IMAGE ===== */
        img {
            margin-top: 15px;
            border-radius: 12px;
            border: 2px solid cyan;
        }

    </style>
</head>

<body>

<!-- ===== HEADER ===== -->
<div class="header">
    <h1>FACE ATTENDANCE DASHBOARD</h1>
    <p>AI Powered System</p>
</div>

<!-- ===== MAIN ===== -->
<div class="container">

    <!-- ===== LEFT CARD ===== -->
    <div class="card">
        <h3>Upload Image</h3>

        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="file" required>
            <br><br>
            <button type="submit">Verify</button>
        </form>

        <!-- RESULT -->
        <h3>{{ message }}</h3>

        <!-- IMAGE PREVIEW -->
        {% if img_path %}
            <img src="{{ img_path }}" width="250">
        {% endif %}
    </div>

    <!-- ===== RIGHT CARD ===== -->
    <div class="card">
        <h3>Attendance</h3>

        {% if data %}
        <table>
            <tr>
                <th>Name</th>
                <th>Date</th>
                <th>Time</th>
            </tr>

            {% for row in data %}
            <tr>
                {% for item in row.strip().split(",") %}
                <td>{{ item }}</td>
                {% endfor %}
            </tr>
            {% endfor %}
        </table>

        <!-- GRAPH BUTTON -->
        <form action="/graph">
            <button>Show Graph</button>
        </form>

        {% else %}
        <p>No attendance yet</p>
        {% endif %}
    </div>

</div>

</body>
</html>
